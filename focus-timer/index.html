<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer</title>
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --border: #e4e0d8;
    --accent: #d9534f;
    --accent-soft: #fbe9e8;
    --ring-track: #ece8e0;
  }
  body.break { --accent: #2f8f6b; --accent-soft: #e3f3ec; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --surface: #22201d;
      --text: #f1eee8;
      --muted: #a39d93;
      --border: #34312c;
      --accent: #ef6f6a;
      --accent-soft: #3a2422;
      --ring-track: #2e2b27;
    }
    body.break { --accent: #4cc497; --accent-soft: #1d3329; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    transition: background .3s;
  }
  main { width: 100%; max-width: 420px; }

  .modes { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; }
  .modes button {
    flex: 1; border: 0; background: none; color: var(--muted);
    padding: 8px 0; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .modes button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .dial { position: relative; margin: 28px auto 20px; width: 260px; height: 260px; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .dial circle { fill: none; stroke-width: 10; }
  .track { stroke: var(--ring-track); }
  .progress { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
  .readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .time { font-size: 60px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .current { color: var(--muted); font-size: 14px; max-width: 190px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .controls { display: flex; gap: 10px; justify-content: center; }
  .controls button {
    font: inherit; font-weight: 600; border-radius: 12px; padding: 12px 22px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .controls .primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 130px; }

  .stats { display: flex; justify-content: space-around; margin: 24px 0; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; }
  form { display: flex; gap: 8px; margin-bottom: 10px; }
  form input {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  form button { font: inherit; border: 0; border-radius: 10px; padding: 0 16px; background: var(--text); color: var(--bg); cursor: pointer; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
  }
  li.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  li.done .label { text-decoration: line-through; color: var(--muted); }
  li input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  li .label { flex: 1; overflow-wrap: anywhere; }
  li .count { font-size: 13px; color: var(--muted); }
  li .del { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 12px; }
</style>
</head>
<body>
<main>
  <div class="modes" role="tablist">
    <button data-mode="focus" class="active">Focus</button>
    <button data-mode="short">Short break</button>
    <button data-mode="long">Long break</button>
  </div>

  <div class="dial">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="54"/>
      <circle class="progress" id="ring" cx="60" cy="60" r="54"/>
    </svg>
    <div class="readout">
      <div class="time" id="time">25:00</div>
      <div class="current" id="current">Pick a task below</div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="start">Start</button>
    <button id="reset">Reset</button>
    <button id="skip" title="Skip to next phase">Skip</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="today">0</b><span>Sessions today</span></div>
    <div class="stat"><b id="minutes">0</b><span>Focus min</span></div>
    <div class="stat"><b id="streak">0</b><span>Day streak</span></div>
  </div>

  <h2>Tasks</h2>
  <form id="add">
    <input id="newTask" placeholder="What are you working on?" autocomplete="off">
    <button>Add</button>
  </form>
  <ul id="tasks"></ul>
</main>

<script>
const DURATIONS = { focus: 25, short: 5, long: 15 }; // minutes
const LONG_EVERY = 4;
const CIRC = 2 * Math.PI * 54;

const $ = id => document.getElementById(id);
const ring = $('ring');
ring.style.strokeDasharray = CIRC;

// ---- persistence ----
function load() {
  try { return JSON.parse(localStorage.getItem('focus-timer')) || {}; } catch { return {}; }
}
function save() {
  try { localStorage.setItem('focus-timer', JSON.stringify(state)); } catch {}
}
const dayKey = (d = new Date()) => d.toLocaleDateString('en-CA'); // YYYY-MM-DD

const state = Object.assign({ tasks: [], selected: null, history: {}, cycle: 0 }, load());

// ---- timer ----
let mode = 'focus';
let remaining = DURATIONS.focus * 60 * 1000;
let endsAt = null;   // timestamp while running
let tick = null;

function setMode(m) {
  mode = m;
  stop();
  remaining = DURATIONS[m] * 60 * 1000;
  document.body.classList.toggle('break', m !== 'focus');
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  render();
}

function start() {
  endsAt = Date.now() + remaining;
  tick = setInterval(update, 250);
  unlockAudio();
  render();
}
function stop() {
  if (endsAt) remaining = Math.max(0, endsAt - Date.now());
  clearInterval(tick);
  tick = endsAt = null;
  render();
}

function update() {
  remaining = Math.max(0, endsAt - Date.now());
  if (remaining === 0) finish();
  else renderTime();
}

function finish(skipped = false) {
  clearInterval(tick);
  tick = endsAt = null;
  if (!skipped) chime();
  if (mode === 'focus' && skipped) {
    state.cycle++;
    save();
    setMode(state.cycle % LONG_EVERY === 0 ? 'long' : 'short');
  } else if (mode === 'focus') {
    const today = dayKey();
    const h = state.history[today] || { sessions: 0, minutes: 0 };
    h.sessions++; h.minutes += DURATIONS.focus;
    state.history[today] = h;
    const t = state.tasks.find(t => t.id === state.selected);
    if (t) t.pomos = (t.pomos || 0) + 1;
    state.cycle++;
    save();
    notify('Focus session done', 'Time for a break.');
    setMode(state.cycle % LONG_EVERY === 0 ? 'long' : 'short');
  } else {
    if (!skipped) notify('Break over', 'Back to it!');
    setMode('focus');
  }
  renderTasks(); renderStats();
}

// ---- rendering ----
function fmt(ms) {
  const s = Math.ceil(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function renderTime() {
  const total = DURATIONS[mode] * 60 * 1000;
  $('time').textContent = fmt(remaining);
  ring.style.strokeDashoffset = CIRC * (1 - remaining / total);
  document.title = endsAt ? `${fmt(remaining)} · ${mode === 'focus' ? 'Focus' : 'Break'}` : 'Focus Timer';
}
function render() {
  renderTime();
  $('start').textContent = endsAt ? 'Pause' : (remaining < DURATIONS[mode] * 60000 ? 'Resume' : 'Start');
  const t = state.tasks.find(t => t.id === state.selected);
  $('current').textContent = mode !== 'focus' ? 'Take a breather' : (t ? t.text : 'Pick a task below');
}

function renderStats() {
  const h = state.history[dayKey()] || { sessions: 0, minutes: 0 };
  $('today').textContent = h.sessions;
  $('minutes').textContent = h.minutes;
  // streak: consecutive days with ≥1 session, counting back from today (or yesterday if none yet today)
  let streak = 0;
  const d = new Date();
  if (!state.history[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (state.history[dayKey(d)]?.sessions) { streak++; d.setDate(d.getDate() - 1); }
  $('streak').textContent = streak;
}

function renderTasks() {
  const ul = $('tasks');
  ul.innerHTML = '';
  if (!state.tasks.length) {
    ul.innerHTML = '<li class="empty" style="cursor:default">No tasks yet — add one above.</li>';
    return;
  }
  for (const t of state.tasks) {
    const li = document.createElement('li');
    li.className = (t.id === state.selected ? 'selected ' : '') + (t.done ? 'done' : '');
    li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Done">
      <span class="label"></span>
      <span class="count">${t.pomos ? '🍅'.repeat(Math.min(t.pomos, 5)) + (t.pomos > 5 ? '+' : '') : ''}</span>
      <button class="del" aria-label="Delete">×</button>`;
    li.querySelector('.label').textContent = t.text;
    li.onclick = () => { state.selected = t.id; save(); renderTasks(); render(); };
    li.querySelector('input').onclick = e => {
      e.stopPropagation(); t.done = e.target.checked; save(); renderTasks();
    };
    li.querySelector('.del').onclick = e => {
      e.stopPropagation();
      state.tasks = state.tasks.filter(x => x !== t);
      if (state.selected === t.id) state.selected = null;
      save(); renderTasks(); render();
    };
    ul.appendChild(li);
  }
}

// ---- sound & notifications ----
let audio;
function unlockAudio() {
  audio ??= new (window.AudioContext || window.webkitAudioContext)();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}
function chime() {
  if (!audio) return;
  [660, 880, 1320].forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    const t0 = audio.currentTime + i * 0.18;
    o.frequency.value = f; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    o.connect(g).connect(audio.destination);
    o.start(t0); o.stop(t0 + 0.55);
  });
}
function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification(title, { body });
}

// ---- wiring ----
$('start').onclick = () => endsAt ? stop() : start();
$('reset').onclick = () => setMode(mode);
$('skip').onclick = () => { stop(); finish(true); };
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('add').onsubmit = e => {
  e.preventDefault();
  const text = $('newTask').value.trim();
  if (!text) return;
  const t = { id: Date.now().toString(36), text, done: false, pomos: 0 };
  state.tasks.push(t);
  state.selected ??= t.id;
  $('newTask').value = '';
  save(); renderTasks(); render();
};
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); $('start').click(); }
});

render(); renderTasks(); renderStats();
</script>
</body>
</html>
