<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer Tests</title>
<style>
  :root { --bg: #f6f4ef; --text: #1f1d1a; --muted: #6b665e; --pass: #2f8f6b; --fail: #d9534f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --text: #f1eee8; --muted: #a39d93; --pass: #4cc497; --fail: #ef6f6a; }
  }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 14px/1.5 ui-monospace, Menlo, monospace; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .summary.pass { color: var(--pass); } .summary.fail { color: var(--fail); }
  h2 { font-size: 14px; margin: 16px 0 4px; color: var(--muted); }
  .pass::before { content: "✓ "; color: var(--pass); }
  .fail::before { content: "✗ "; color: var(--fail); }
  .err { color: var(--fail); margin-left: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1 class="summary" id="summary">Running…</h1>
<div id="results"></div>
<script src="timer-core.js"></script>
<script>
// Minimal test harness: describe/test/assert. Results also land on window.testResults.
const suites = [];
function describe(name, fn) { suites.push({ name, tests: [] }); fn(); }
function test(name, fn) { suites[suites.length - 1].tests.push({ name, fn }); }
function eq(actual, expected, msg = '') {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${msg}${msg ? ': ' : ''}expected ${e}, got ${a}`);
}
</script>
<script src="tests.js"></script>
<script>
(function run() {
  const out = document.getElementById('results');
  let passed = 0, failed = 0;
  const failures = [];
  for (const s of suites) {
    const h = document.createElement('h2'); h.textContent = s.name; out.appendChild(h);
    for (const t of s.tests) {
      const row = document.createElement('div');
      try { t.fn(); row.className = 'pass'; passed++; }
      catch (e) { row.className = 'fail'; failed++; failures.push(`${s.name} › ${t.name}: ${e.message}`); }
      row.textContent = t.name;
      out.appendChild(row);
      if (row.className === 'fail') {
        const err = document.createElement('div'); err.className = 'err'; err.textContent = failures.at(-1).split(': ').slice(1).join(': ');
        out.appendChild(err);
      }
    }
  }
  const summary = document.getElementById('summary');
  summary.textContent = failed ? `${failed} failed, ${passed} passed` : `All ${passed} tests passed`;
  summary.classList.add(failed ? 'fail' : 'pass');
  document.title = `${failed ? 'FAIL' : 'PASS'} ${passed}/${passed + failed} · Focus Timer Tests`;
  window.testResults = { passed, failed, failures };
})();
</script>
</body>
</html>
